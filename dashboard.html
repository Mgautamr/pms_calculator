<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio dashboard</title>
  <style>
    :root {
      --bg: #091018;
      --card: #111b2b;
      --card-2: #122133;
      --line: rgba(255,255,255,0.08);
      --text: #edf6ff;
      --muted: #a7b7cc;
      --green: #34d399;
      --sky: #7dd3fc;
      --orange: #fbbf24;
      --red: #f87171;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #070d17 0%, #121d2f 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 18px 56px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand {
      font-size: clamp(1.6rem, 2.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .nav a {
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 0.9rem;
    }
    .hero {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(17,27,43,0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }
    .label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .value {
      font-size: clamp(1.4rem, 2.3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .trend {
      font-size: 0.9rem;
      margin-top: 8px;
      color: var(--green);
    }
    .main {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 20px;
    }
    .chart {
      background: rgba(17,27,43,0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      min-height: 320px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }
    .chart svg {
      width: 100%;
      height: 260px;
      display: block;
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .list {
      display: grid;
      gap: 14px;
    }
    .list .item {
      background: rgba(17,27,43,0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .progress {
      position: relative;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .progress > span {
      position: absolute;
      inset: 0 auto 0 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--sky), var(--green));
    }
    .muted { color: var(--muted); }
    .good { color: var(--green); }
    .warn { color: var(--orange); }
    .bad { color: var(--red); }
    @media (max-width: 840px) {
      .hero {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .main {
        grid-template-columns: 1fr;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    @media (max-width: 500px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Portfolio dashboard</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="fee.html">Fee calc</a>
        <a href="compare.html">Compare</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>

    <section class="hero">
      <div class="card">
        <div class="label">Portfolio value</div>
        <div class="value">₹48.2L</div>
        <div class="trend">+12.4% vs benchmark</div>
      </div>
      <div class="card">
        <div class="label">Benchmark</div>
        <div class="value">₹42.9L</div>
        <div class="trend">12m performance</div>
      </div>
      <div class="card">
        <div class="label">Max drawdown</div>
        <div class="value">-9.1%</div>
        <div class="trend bad">Within tolerance</div>
      </div>
      <div class="card">
        <div class="label">Risk score</div>
        <div class="value">6.4 / 10</div>
        <div class="trend good">Balanced</div>
      </div>
    </section>

    <section class="main">
      <div class="chart">
        <svg viewBox="0 0 640 260" preserveAspectRatio="none" aria-label="Portfolio chart">
          <defs>
            <linearGradient id="fillArea" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.02" />
            </linearGradient>
          </defs>
          <g opacity="0.28" stroke="rgba(255,255,255,0.15)" stroke-width="1">
            <line x1="0" y1="40" x2="640" y2="40"></line>
            <line x1="0" y1="100" x2="640" y2="100"></line>
            <line x1="0" y1="160" x2="640" y2="160"></line>
            <line x1="0" y1="220" x2="640" y2="220"></line>
          </g>
          <path d="M0,200 C80,175, 120,150, 180,145 S300,120, 360,90 S490,95, 640,40 L640,260 L0,260 Z" fill="url(#fillArea)"></path>
          <path d="M0,200 C80,175, 120,150, 180,145 S300,120, 360,90 S490,95, 640,40" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"></path>
          <path d="M0,220 C90,200, 165,175, 240,160 S360,135, 420,150 S550,120, 640,110" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.9"></path>
        </svg>
        <div class="legend">
          <span><span class="dot" style="background:#7dd3fc"></span>Portfolio</span>
          <span><span class="dot" style="background:#34d399"></span>Benchmark</span>
        </div>
      </div>

      <div class="list">
        <div class="item">
          <div class="muted">Allocation</div>
          <div class="row">
            <span>Equity</span>
            <strong>58%</strong>
          </div>
          <div class="progress"><span style="width:58%"></span></div>
        </div>
        <div class="item">
          <div class="muted">Debt</div>
          <div class="row">
            <span>Fixed income</span>
            <strong>22%</strong>
          </div>
          <div class="progress"><span style="width:22%; background:linear-gradient(90deg, var(--orange), #f59e0b)"></span></div>
        </div>
        <div class="item">
          <div class="muted">Alternates</div>
          <div class="row">
            <span>Private assets</span>
            <strong>20%</strong>
          </div>
          <div class="progress"><span style="width:20%; background:linear-gradient(90deg, var(--purple), #8b5cf6)"></span></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
