<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fee calculator</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #172235;
      --line: rgba(255,255,255,0.09);
      --text: #edf3ff;
      --muted: #a7b5d3;
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --warn: #f59e0b;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #090d18 0%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 18px 56px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand {
      font-size: clamp(1.6rem, 2.5vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav a {
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 22px;
    }
    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }
    .panel {
      padding: 22px;
    }
    .panel h2 {
      margin: 0 0 18px;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }
    label {
      display: block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      margin-top: 8px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    .stat {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .stat .k {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .stat .v {
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .accent { color: var(--accent-2); }
    .warn { color: var(--warn); }
    .danger { color: var(--danger); }
    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .stats {
        grid-template-columns: 1fr;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">PMS Calculator</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="fee.html">Fee calc</a>
        <a href="compare.html">Compare</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>

    <div class="grid">
      <section class="card panel">
        <h2>Inputs</h2>
        <label>
          Initial amount
          <input id="initial" type="number" value="1000000" min="0" step="1000" />
        </label>
        <label>
          Monthly SIP
          <input id="sip" type="number" value="25000" min="0" step="1000" />
        </label>
        <label>
          Years
          <input id="years" type="number" value="10" min="1" max="40" step="1" />
        </label>
        <label>
          Expected return (% p.a.)
          <input id="returnRate" type="number" value="12" min="0" max="30" step="0.1" />
        </label>
        <label>
          Annual fee (% p.a.)
          <input id="feeRate" type="number" value="1.5" min="0" max="10" step="0.1" />
        </label>
      </section>

      <section class="card panel">
        <div class="stats">
          <div class="stat">
            <div class="k">Without fee</div>
            <div class="v" id="withoutFee">₹0</div>
          </div>
          <div class="stat">
            <div class="k">With fee</div>
            <div class="v" id="withFee">₹0</div>
          </div>
          <div class="stat">
            <div class="k">Fees lost</div>
            <div class="v danger" id="feesLost">₹0</div>
          </div>
        </div>

        <div class="foot">
          <div class="pill" id="effectiveReturn">Effective annual return: 0%</div>
          <div class="pill" id="totalInvested">Total invested: ₹0</div>
        </div>

        <div style="margin-top: 20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em;">
            <span>Value retention</span>
            <span id="retentionPct">0%</span>
          </div>
          <div class="bar"><span id="retentionBar" style="width:0%"></span></div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Metric</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monthly SIP</td>
              <td id="sipTable">₹0</td>
            </tr>
            <tr>
              <td>Investment horizon</td>
              <td id="horizonTable">0 years</td>
            </tr>
            <tr>
              <td>Annual return</td>
              <td id="returnTable">0%</td>
            </tr>
            <tr>
              <td>Fee drag</td>
              <td id="feeTable">0%</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const money = (value) => new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      maximumFractionDigits: 0
    }).format(value);

    function getInputs() {
      return {
        initial: Number(document.getElementById('initial').value) || 0,
        sip: Number(document.getElementById('sip').value) || 0,
        years: Number(document.getElementById('years').value) || 1,
        returnRate: Number(document.getElementById('returnRate').value) || 0,
        feeRate: Number(document.getElementById('feeRate').value) || 0
      };
    }

    function futureValueMonthly(initial, monthly, years, annualRate) {
      const r = annualRate / 100 / 12;
      const n = years * 12;
      let fv = initial;
      for (let i = 0; i < n; i++) {
        fv = fv * (1 + r) + monthly;
      }
      return fv;
    }

    function update() {
      const { initial, sip, years, returnRate, feeRate } = getInputs();
      const withoutFee = futureValueMonthly(initial, sip, years, returnRate);
      const withFee = futureValueMonthly(initial, sip, years, Math.max(0, returnRate - feeRate));
      const feesLost = Math.max(0, withoutFee - withFee);
      const invested = initial + sip * years * 12;
      const retention = withoutFee > 0 ? (withFee / withoutFee) * 100 : 0;
      const effective = returnRate - feeRate;

      document.getElementById('withoutFee').textContent = money(withoutFee);
      document.getElementById('withFee').textContent = money(withFee);
      document.getElementById('feesLost').textContent = money(feesLost);
      document.getElementById('effectiveReturn').textContent = `Effective annual return: ${effective.toFixed(2)}%`;
      document.getElementById('totalInvested').textContent = `Total invested: ${money(invested)}`;
      document.getElementById('retentionPct').textContent = `${retention.toFixed(1)}%`;
      document.getElementById('retentionBar').style.width = `${Math.max(0, Math.min(100, retention))}%`;
      document.getElementById('sipTable').textContent = money(sip);
      document.getElementById('horizonTable').textContent = `${years} years`;
      document.getElementById('returnTable').textContent = `${returnRate.toFixed(1)}%`;
      document.getElementById('feeTable').textContent = `${feeRate.toFixed(1)}%`;
    }

    ['initial', 'sip', 'years', 'returnRate', 'feeRate'].forEach((id) => {
      document.getElementById(id).addEventListener('input', update);
    });

    update();
  </script>
</body>
</html>
