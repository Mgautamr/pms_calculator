<script>stlite.mount({"requirements": ["altair<6"], "entrypoint": "entry.py", "files": {"app/formatting.py": "\"\"\"Display helpers for the Streamlit app.\"\"\"\n\n\ndef format_inr(amount, decimals=0):\n    \"\"\"Format a number in Indian style with the rupee sign.\n\n    Example: 5000000 -> '\u20b950,00,000', -1234.5 -> '-\u20b91,235'.\n    \"\"\"\n    sign = \"-\" if amount < 0 else \"\"\n    text = f\"{abs(amount):.{decimals}f}\"\n    int_part, _, frac = text.partition(\".\")\n    if len(int_part) > 3:\n        last3, rest = int_part[-3:], int_part[:-3]\n        groups = []\n        while len(rest) > 2:\n            groups.insert(0, rest[-2:])\n            rest = rest[:-2]\n        if rest:\n            groups.insert(0, rest)\n        int_part = \",\".join(groups + [last3])\n    out = f\"{sign}\u20b9{int_part}\"\n    return f\"{out}.{frac}\" if frac else out\n\n\ndef format_pct(value, decimals=2):\n    \"\"\"0.0725 -> '7.25%'.\"\"\"\n    return f\"{value * 100:.{decimals}f}%\"\n", "app/pages/1_Fee_Calculator.py": "import sys\nfrom pathlib import Path\n\n# Make the project root importable (so `engine` and `app` can be found).\nsys.path.insert(0, str(Path(__file__).resolve().parents[2]))\n\nimport altair as alt\nimport pandas as pd\nimport streamlit as st\n\nfrom app import theme\nfrom app.formatting import format_inr, format_pct\nfrom engine.fees import simulate\n\nst.set_page_config(page_title=\"PMS Fee Calculator\", page_icon=\"\u20b9\", layout=\"wide\")\ntheme.apply()\n\n# ---------- presets (values are in percent) ----------\nPRESETS = {\n    \"Custom\": None,\n    \"Fixed fee only\": dict(fixed=2.5, perf=0.0, hurdle=0.0, catch_up=False, hwm=False, exit=0.0),\n    \"Hybrid (fixed + profit share)\": dict(fixed=1.5, perf=20.0, hurdle=0.0, catch_up=False, hwm=False, exit=0.0),\n    \"Hurdle, no catch-up\": dict(fixed=0.0, perf=20.0, hurdle=10.0, catch_up=False, hwm=False, exit=0.0),\n    \"Hurdle with catch-up\": dict(fixed=0.0, perf=20.0, hurdle=10.0, catch_up=True, hwm=False, exit=0.0),\n    \"High-water mark\": dict(fixed=0.0, perf=20.0, hurdle=0.0, catch_up=False, hwm=True, exit=0.0),\n    \"Hurdle + high-water mark\": dict(fixed=1.0, perf=20.0, hurdle=8.0, catch_up=False, hwm=True, exit=0.0),\n}\nDEFAULTS = PRESETS[\"Hybrid (fixed + profit share)\"]\nfor key, val in DEFAULTS.items():\n    st.session_state.setdefault(key, val)\n\n\ndef apply_preset():\n    preset = PRESETS[st.session_state[\"preset\"]]\n    if preset:\n        for key, val in preset.items():\n            st.session_state[key] = val\n\n\n# ---------- sidebar inputs ----------\nwith st.sidebar:\n    st.header(\"Inputs\")\n    initial = st.number_input(\"Initial investment (\u20b9)\", min_value=100_000,\n                              value=5_000_000, step=100_000)\n    st.caption(format_inr(initial))\n    years = st.slider(\"Years\", 1, 10, 5)\n\n    mode = st.radio(\"Gross returns\", [\"Same every year\", \"Different each year\"])\n    if mode == \"Same every year\":\n        flat = st.number_input(\"Gross return per year (%)\", min_value=-90.0,\n                               value=12.0, step=0.5, format=\"%.2f\")\n        returns = [flat / 100] * years\n    else:\n        returns = [\n            st.number_input(f\"Year {i + 1} return (%)\", min_value=-90.0,\n                            value=12.0, step=0.5, format=\"%.2f\", key=f\"ret_{i}\") / 100\n            for i in range(years)\n        ]\n\n    st.subheader(\"Fee structure\")\n    st.selectbox(\"Start from a preset\", list(PRESETS), key=\"preset\", on_change=apply_preset)\n    fixed = st.number_input(\"Fixed fee (% of opening value)\", min_value=0.0,\n                            max_value=10.0, step=0.25, key=\"fixed\")\n    perf = st.number_input(\"Performance fee (% of profit)\", min_value=0.0,\n                           max_value=50.0, step=1.0, key=\"perf\")\n    hurdle = st.number_input(\"Hurdle rate (%)\", min_value=0.0,\n                             max_value=30.0, step=0.5, key=\"hurdle\")\n    catch_up = st.checkbox(\"Catch-up\", key=\"catch_up\")\n    hwm = st.checkbox(\"High-water mark\", key=\"hwm\")\n    exit_load = st.number_input(\"Exit load (% of final value)\", min_value=0.0,\n                                max_value=5.0, step=0.25, key=\"exit\")\n\n\n# ---------- calculations ----------\ndef run(fixed_pct, perf_pct, hurdle_pct, catch_up_flag, hwm_flag, exit_pct):\n    return simulate(initial, returns, fixed_pct / 100, perf_pct / 100,\n                    hurdle_pct / 100, catch_up_flag, hwm_flag, exit_pct / 100)\n\n\ndef cagr(final_value):\n    if final_value <= 0:\n        return None\n    return (final_value / initial) ** (1 / years) - 1\n\n\ndef pct_or_na(value):\n    return \"n/a\" if value is None else format_pct(value)\n\n\nresult = run(fixed, perf, hurdle, catch_up, hwm, exit_load)\n\ngross_path = [initial]\nfor r in returns:\n    gross_path.append(gross_path[-1] * (1 + r))\ngross_final = gross_path[-1]\nnet_path = [initial] + result[\"closing_values\"]\n\ngross_cagr = cagr(gross_final)\nnet_cagr = cagr(result[\"final_net_value\"])\ndrag = None if net_cagr is None else gross_cagr - net_cagr\n\n# ---------- page ----------\ntheme.masthead(\"PMS fee calculator\",\n               \"See what an investor keeps after fees, for the same gross returns.\")\n\nfinal = result[\"final_net_value\"]\ngap = final - gross_final\ntheme.stat_strip([\n    {\"label\": \"Final net value\", \"value\": format_inr(final),\n     \"note\": f\"{format_inr(gap)} against no fees\", \"tone\": \"bad\" if gap < 0 else \"neutral\"},\n    {\"label\": \"Total fees paid\", \"value\": format_inr(result[\"total_fees\"]),\n     \"note\": f\"Over {years} {'year' if years == 1 else 'years'}\"},\n    {\"label\": \"Net annual return (CAGR)\", \"value\": pct_or_na(net_cagr),\n     \"note\": f\"Gross {pct_or_na(gross_cagr)}\"},\n    {\"label\": \"Fee drag a year\", \"value\": \"n/a\" if drag is None else f\"{drag * 100:.2f} pts\",\n     \"note\": \"Gross CAGR minus net CAGR\"},\n])\n\ntab_year, tab_compare, tab_rules = st.tabs([\"Year by year\", \"Compare fee models\", \"Rules used\"])\n\nwith tab_year:\n    rows, opening = [], initial\n    for i in range(years):\n        closing = result[\"closing_values\"][i]\n        rows.append([i + 1, format_pct(returns[i]), format_inr(opening),\n                     format_inr(result[\"fixed_fees\"][i]), format_inr(result[\"perf_fees\"][i]),\n                     format_inr(closing)])\n        opening = closing\n    theme.data_table([\"Year\", \"Gross return\", \"Opening value\", \"Fixed fee\", \"Performance fee\",\n                      \"Closing value\"], rows, numeric_cols=(1, 2, 3, 4, 5))\n    if result[\"exit_amount\"] > 0:\n        st.write(f\"Exit load on the final value: **{format_inr(result['exit_amount'])}**\")\n\n    theme.section(\"Value over time\", \"Portfolio value at each year end, before any exit load.\")\n    long = pd.concat([\n        pd.DataFrame({\"Year\": range(years + 1), \"Series\": \"No fees\", \"Value\": gross_path}),\n        pd.DataFrame({\"Year\": range(years + 1), \"Series\": \"After fees\", \"Value\": net_path}),\n    ])\n    growth = alt.Chart(long).mark_line(strokeWidth=2.6).encode(\n        x=alt.X(\"Year:Q\", axis=alt.Axis(tickMinStep=1, format=\"d\"), title=\"Year\"),\n        y=alt.Y(\"Value:Q\", title=\"Portfolio value (\u20b9)\", scale=alt.Scale(zero=False),\n                axis=alt.Axis(format=\"~s\")),\n        color=alt.Color(\"Series:N\", scale=alt.Scale(domain=[\"No fees\", \"After fees\"],\n                                                    range=[theme.SLATE, theme.INK]),\n                        legend=alt.Legend(orient=\"top\", title=None)),\n        tooltip=[\"Year:Q\", \"Series:N\", alt.Tooltip(\"Value:Q\", format=\",.0f\")],\n    ).properties(height=320)\n    theme.show_chart(growth)\n\nwith tab_compare:\n    st.write(\"Same gross returns, and your fixed fee, profit share, hurdle and exit load. \"\n             \"Only the fee structure changes.\")\n    if hurdle == 0:\n        theme.notice(\"Your hurdle is 0%\",\n                     text=\"Several structures give similar answers. Set a hurdle above 0% \"\n                          \"in the sidebar to see them separate.\")\n    models = [\n        (\"Fixed fee only\", dict(perf_pct=0.0, hurdle_pct=0.0, catch_up_flag=False, hwm_flag=False)),\n        (\"Hybrid (fixed + profit share)\", dict(perf_pct=perf, hurdle_pct=0.0, catch_up_flag=False, hwm_flag=False)),\n        (\"Hurdle, no catch-up\", dict(perf_pct=perf, hurdle_pct=hurdle, catch_up_flag=False, hwm_flag=False)),\n        (\"Hurdle with catch-up\", dict(perf_pct=perf, hurdle_pct=hurdle, catch_up_flag=True, hwm_flag=False)),\n        (\"High-water mark\", dict(perf_pct=perf, hurdle_pct=0.0, catch_up_flag=False, hwm_flag=True)),\n        (\"Hurdle + high-water mark\", dict(perf_pct=perf, hurdle_pct=hurdle, catch_up_flag=False, hwm_flag=True)),\n    ]\n    table, fees_paid = [], []\n    for name, params in models:\n        res = run(fixed, exit_pct=exit_load, **params)\n        n_cagr = cagr(res[\"final_net_value\"])\n        table.append([name, format_inr(res[\"final_net_value\"]), format_inr(res[\"total_fees\"]),\n                      pct_or_na(n_cagr),\n                      \"n/a\" if n_cagr is None else f\"{(gross_cagr - n_cagr) * 100:.2f} pts\"])\n        fees_paid.append({\"Structure\": name, \"Fees\": res[\"total_fees\"]})\n    theme.data_table([\"Fee structure\", \"Final net value\", \"Total fees\", \"Net CAGR\", \"Fee drag\"],\n                     table, numeric_cols=(1, 2, 3, 4), min_width=640)\n\n    theme.section(\"Total fees by structure\")\n    bars = alt.Chart(pd.DataFrame(fees_paid)).mark_bar(color=theme.SAFFRON).encode(\n        x=alt.X(\"Fees:Q\", title=\"Total fees paid (\u20b9)\", axis=alt.Axis(format=\"~s\")),\n        y=alt.Y(\"Structure:N\", sort=\"-x\", title=None, axis=alt.Axis(labelLimit=260)),\n        tooltip=[\"Structure:N\", alt.Tooltip(\"Fees:Q\", format=\",.0f\")],\n    ).properties(height=40 * len(models))\n    theme.show_chart(bars)\n\nwith tab_rules:\n    st.markdown(\n        \"\"\"\n- Annual periods. Fees are charged at year end. No money is added or withdrawn.\n- **Fixed fee** is a % of the opening value and is charged even in loss years.\n- **Performance fee** is charged on profit after the fixed fee, measured against a base:\n  the opening value, or the **high-water mark** (highest year-end value so far) if it is on.\n- **Hurdle:** only profit above base \u00d7 hurdle rate is charged. With **catch-up**, once profit\n  clears the hurdle the fee applies to the whole profit.\n- **Exit load** is charged once, on the final value.\n- CAGR = (final value \u00f7 initial investment)^(1 \u00f7 years) \u2212 1. Fee drag = gross CAGR \u2212 net CAGR.\n\"\"\"\n    )\n\ntheme.footnote(\"Educational illustration only, not investment advice. Returns and fees are \"\n               \"assumptions you enter, not real fund data or any manager's actual terms.\")\n", "app/pages/2_Compare_Vehicles.py": "import html\nimport sys\nfrom pathlib import Path\n\n# Make the project root importable (so `engine` and `app` can be found).\nsys.path.insert(0, str(Path(__file__).resolve().parents[2]))\n\nimport streamlit as st\n\nfrom app import theme\nfrom app.formatting import format_inr\nfrom app.vehicles import (STATUS_ORDER, STATUS_SHORT, check_eligibility,\n                          large_value_fund_note, load_data)\n\nst.set_page_config(page_title=\"Compare PMS, MF, SIF and AIF\", page_icon=\"\u20b9\", layout=\"wide\")\ntheme.apply()\n\n\n@st.cache_data\ndef get_data():\n    return load_data()\n\n\ndata = get_data()\nmeta = data[\"meta\"]\nvehicles = data[\"vehicles\"]\n\nSHORT_NAMES = {\n    \"mutual_fund\": \"Mutual fund\",\n    \"sif\": \"SIF\",\n    \"pms\": \"PMS\",\n    \"prim\": \"PMS mutual-fund route (PRIM, pending)\",\n    \"aif\": \"AIF\",\n}\n\n\ndef dot(status):\n    return theme.status_dot_html(status, STATUS_SHORT[status])\n\n\ntheme.masthead(\n    \"Compare PMS, mutual funds, SIFs and AIFs\",\n    f\"Facts last verified {meta['last_verified']}. Every fact carries a dot showing how well it \"\n    \"was verified, and a link to its source in the Sources tab.\")\ntheme.notice(\"Open items\", items=meta[\"open_items\"])\nst.markdown(theme.legend_html([(s, STATUS_SHORT[s]) for s in STATUS_ORDER]), unsafe_allow_html=True)\n\ntab_compare, tab_access, tab_sources = st.tabs(\n    [\"Comparison\", \"Which can I access?\", \"Sources and gaps\"])\n\n# ---------- tab 1: comparison table ----------\nROWS = [\n    (\"Regulator\", lambda v: v[\"regulator\"]),\n    (\"Rulebook\", lambda v: v[\"regulation\"]),\n    (\"Minimum investment\", [\"min_investment\"]),\n    (\"What it is\", [\"structure\", \"categories\"]),\n    (\"Fees\", [\"fees\"]),\n    (\"Tax\", [\"tax\", \"equity_oriented\", \"tax_cat3_effective\"]),\n    (\"Tenure and liquidity\", [\"lock_in\", \"liquidity\"]),\n    (\"Accredited investor rules\", [\"accredited_investor\", \"large_value_fund\"]),\n]\n\n\ndef table_cell(vehicle, spec):\n    if callable(spec):\n        return spec(vehicle)\n    parts = []\n    for key in spec:\n        fact = vehicle[\"facts\"].get(key)\n        if fact:\n            parts.append(theme.esc(fact[\"value\"]) + \" \" + dot(fact[\"status\"]))\n    return theme.Html(\" \".join(parts)) if parts else \"\u2013\"\n\n\nwith tab_compare:\n    ids = list(vehicles)\n    headers = [\"\"] + [SHORT_NAMES.get(i, vehicles[i][\"name\"]) for i in ids]\n    rows = [[label] + [table_cell(vehicles[i], spec) for i in ids] for label, spec in ROWS]\n    theme.data_table(headers, rows, min_width=1000)\n\n# ---------- tab 2: eligibility ----------\nwith tab_access:\n    theme.section(\"Which of these could you access?\",\n                  \"Enter an amount to check it against each stated minimum.\")\n    col_a, col_b = st.columns([2, 1])\n    amount = col_a.number_input(\"Amount you could invest (\u20b9)\", min_value=0,\n                                value=5_000_000, step=100_000)\n    col_a.caption(format_inr(amount))\n    accredited = col_b.checkbox(\"I hold a SEBI accredited investor certificate\")\n\n    rows = []\n    for r in check_eligibility(data, amount, accredited):\n        is_open = r[\"verdict\"] == \"open\"\n        rows.append({\n            \"name\": SHORT_NAMES.get(r[\"id\"], r[\"name\"]),\n            \"verdict\": \"open\" if is_open else \"below\",\n            \"verdict_text\": \"Open to you\" if is_open else \"Below the minimum\",\n            \"detail\": theme.Html(theme.esc(r[\"detail\"]) + \" \" + dot(r[\"figure_status\"])),\n            \"caution\": r[\"caution\"],\n        })\n    st.markdown(theme.verdict_rows_html(rows), unsafe_allow_html=True)\n\n    note = large_value_fund_note(data, amount, accredited)\n    if note:\n        theme.notice(\"Also open to you\", text=note)\n\n    st.caption(\"Meeting a minimum does not mean a product suits you, or that you meet its other \"\n               \"conditions (KYC, residency, strategy risk). Check each offer document.\")\n\n# ---------- tab 3: sources ----------\nwith tab_sources:\n    counts = {s: 0 for s in STATUS_ORDER}\n    for v in vehicles.values():\n        for f in v[\"facts\"].values():\n            counts[f[\"status\"]] += 1\n    st.markdown(theme.legend_html([(s, f\"{STATUS_SHORT[s]}: {n}\") for s, n in counts.items() if n]),\n                unsafe_allow_html=True)\n\n    for vid, v in vehicles.items():\n        with st.expander(SHORT_NAMES.get(vid, v[\"name\"])):\n            st.markdown(f\"**Regulator:** {v['regulator']}  \\n**Rulebook:** {v['regulation']}\")\n            for fact in v[\"facts\"].values():\n                st.markdown(f\"**{html.escape(fact['label'])}** {dot(fact['status'])} \"\n                            f\"<span class='pms-muted'>{html.escape(STATUS_SHORT[fact['status']])}<\/span>\",\n                            unsafe_allow_html=True)\n                st.write(fact[\"value\"])\n                if fact.get(\"note\"):\n                    st.caption(fact[\"note\"])\n                if fact[\"sources\"]:\n                    for s in fact[\"sources\"]:\n                        st.markdown(f\"- [{s['supports']}]({s['url']})\")\n                else:\n                    st.caption(\"No source found.\")\n\ntheme.footnote(\"Educational illustration only, not investment advice. Rules and rates change; \"\n               \"confirm with the regulator or a registered adviser before acting.\")\n", "app/pages/3_Portfolio_Dashboard.py": "import sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\n# Make the project root importable (so `engine` and `app` can be found).\nsys.path.insert(0, str(ROOT))\n\nimport altair as alt\nimport pandas as pd\nimport streamlit as st\n\nfrom app import theme\nfrom app.formatting import format_pct\nfrom app.portfolio_io import DataError, align, infer_periods_per_year, parse_series, rebase\nfrom engine.analytics import drawdown_series, summarize\n\nst.set_page_config(page_title=\"Portfolio dashboard\", page_icon=\"\u20b9\", layout=\"wide\")\ntheme.apply()\n\nSAMPLE_PORTFOLIO = ROOT / \"data\" / \"sample_portfolio.csv\"\nSAMPLE_BENCHMARK = ROOT / \"data\" / \"sample_benchmark.csv\"\nFREQUENCY = {252: \"daily\", 52: \"weekly\", 12: \"monthly\", 4: \"quarterly\", 1: \"yearly\"}\n\ntheme.masthead(\n    \"Portfolio dashboard\",\n    \"Upload a portfolio's value history to see how fast it grew, how bumpy the ride was and \"\n    \"how deep its worst fall went. Add a benchmark to compare.\")\n\n# ---------- sidebar ----------\nwith st.sidebar:\n    st.header(\"Your data\")\n    uploaded_portfolio = st.file_uploader(\"Portfolio values (CSV)\", type=\"csv\")\n    uploaded_benchmark = st.file_uploader(\"Benchmark values (CSV, optional)\", type=\"csv\")\n    risk_free_pct = st.number_input(\"Risk-free rate (% a year)\", min_value=0.0, max_value=20.0,\n                                    value=6.0, step=0.25)\n    st.caption(\"An assumption you set. It is only used for the Sharpe ratio.\")\n    with st.expander(\"CSV format\"):\n        st.markdown(\n            \"Two columns with a header row: `date,value`.\\n\\n\"\n            \"- Dates as `YYYY-MM-DD` or `DD-MM-YYYY`.\\n\"\n            \"- Values are portfolio value or NAV, all above zero.\\n\"\n            \"- One row per date, at least 3 rows.\\n\"\n            \"- Daily, weekly, monthly or quarterly data all work.\")\n    st.download_button(\"Download CSV template\", data=SAMPLE_PORTFOLIO.read_text(encoding=\"utf-8\"),\n                       file_name=\"portfolio_template.csv\", mime=\"text/csv\")\n\n# ---------- load and validate ----------\nusing_sample = uploaded_portfolio is None\nportfolio_source = SAMPLE_PORTFOLIO if using_sample else uploaded_portfolio\nif uploaded_benchmark is not None:\n    benchmark_source = uploaded_benchmark\nelse:\n    benchmark_source = SAMPLE_BENCHMARK if using_sample else None\n\ntry:\n    portfolio = parse_series(portfolio_source)\nexcept DataError as err:\n    theme.notice(\"The portfolio file can't be used yet\", text=str(err))\n    st.stop()\n\nbenchmark = None\nif benchmark_source is not None:\n    try:\n        benchmark = parse_series(benchmark_source)\n        portfolio, benchmark = align(portfolio, benchmark)\n    except DataError as err:\n        theme.notice(\"The benchmark file can't be used yet\", text=str(err))\n        st.stop()\n\ndates = [d.date() for d in portfolio[\"date\"]]\nperiods = infer_periods_per_year(portfolio[\"date\"])\nrisk_free = risk_free_pct / 100\n\ntry:\n    mine = summarize(dates, list(portfolio[\"value\"]), risk_free, periods)\n    theirs = summarize(dates, list(benchmark[\"value\"]), risk_free, periods) if benchmark is not None else None\nexcept ValueError as err:\n    theme.notice(\"The measures can't be calculated\", text=str(err))\n    st.stop()\n\nif using_sample:\n    theme.notice(\"Showing sample data\",\n                 text=\"This is synthetic data, not a real portfolio or fund. \"\n                      \"Upload your own CSV in the sidebar to replace it.\")\n\n# ---------- headline figures ----------\ncagr_note = vol_note = dd_note = sharpe_note = None\ncagr_tone = \"neutral\"\nif theirs:\n    gap = mine[\"cagr\"] - theirs[\"cagr\"]\n    cagr_note = f\"{gap * 100:+.1f} pts against the benchmark's {format_pct(theirs['cagr'])}\"\n    cagr_tone = \"good\" if gap >= 0 else \"bad\"\n    vol_note = f\"Benchmark {format_pct(theirs['volatility'])}\"\n    dd_note = f\"Benchmark {format_pct(theirs['max_drawdown'])}\"\n    sharpe_note = f\"Benchmark {theirs['sharpe']:.2f}\"\nelse:\n    sharpe_note = f\"At a {risk_free_pct:.2f}% risk-free rate\"\n\ntheme.stat_strip([\n    {\"label\": \"Annual return (CAGR)\", \"value\": format_pct(mine[\"cagr\"]), \"note\": cagr_note, \"tone\": cagr_tone},\n    {\"label\": \"Volatility a year\", \"value\": format_pct(mine[\"volatility\"]), \"note\": vol_note},\n    {\"label\": \"Deepest fall from a peak\", \"value\": format_pct(mine[\"max_drawdown\"]), \"note\": dd_note},\n    {\"label\": \"Sharpe ratio\", \"value\": f\"{mine['sharpe']:.2f}\", \"note\": sharpe_note},\n])\nst.caption(f\"{len(portfolio)} {FREQUENCY[periods]} values from {dates[0]:%d %b %Y} to {dates[-1]:%d %b %Y}\"\n           + (\", on the dates shared with the benchmark.\" if benchmark is not None else \".\"))\n\n# ---------- growth chart ----------\ntheme.section(\"Growth of 100\", \"Both series are rebased to 100 on the first date, so they start level.\")\nnames = [\"Your portfolio\"] + ([\"Benchmark\"] if benchmark is not None else [])\nframes = [pd.DataFrame({\"Date\": portfolio[\"date\"], \"Series\": \"Your portfolio\",\n                        \"Value\": rebase(list(portfolio[\"value\"]))})]\nif benchmark is not None:\n    frames.append(pd.DataFrame({\"Date\": benchmark[\"date\"], \"Series\": \"Benchmark\",\n                                \"Value\": rebase(list(benchmark[\"value\"]))}))\ngrowth = alt.Chart(pd.concat(frames)).mark_line(strokeWidth=2.6).encode(\n    x=alt.X(\"Date:T\", title=None),\n    y=alt.Y(\"Value:Q\", title=\"Value of 100 invested\", scale=alt.Scale(zero=False)),\n    color=alt.Color(\"Series:N\", scale=alt.Scale(domain=names, range=[theme.INK, theme.SLATE][:len(names)]),\n                    legend=alt.Legend(orient=\"top\", title=None)),\n    tooltip=[alt.Tooltip(\"Date:T\", format=\"%d %b %Y\"), \"Series:N\", alt.Tooltip(\"Value:Q\", format=\".1f\")],\n).properties(height=340)\ntheme.show_chart(growth)\n\n# ---------- drawdown chart ----------\ntheme.section(\"Falls from the peak\",\n              \"How far your portfolio sat below its highest earlier value, at each date.\")\ndd = pd.DataFrame({\"Date\": portfolio[\"date\"], \"Drawdown\": drawdown_series(list(portfolio[\"value\"]))})\ndrawdown = alt.Chart(dd).mark_area(color=theme.BRICK, opacity=0.28,\n                                   line={\"color\": theme.BRICK, \"strokeWidth\": 1.6}).encode(\n    x=alt.X(\"Date:T\", title=None),\n    y=alt.Y(\"Drawdown:Q\", title=\"Below previous peak\", axis=alt.Axis(format=\"%\")),\n    tooltip=[alt.Tooltip(\"Date:T\", format=\"%d %b %Y\"), alt.Tooltip(\"Drawdown:Q\", format=\".1%\")],\n).properties(height=220)\ntheme.show_chart(drawdown)\n\n# ---------- side by side ----------\nif theirs:\n    theme.section(\"Side by side\")\n    theme.data_table(\n        [\"Measure\", \"Your portfolio\", \"Benchmark\"],\n        [\n            [\"Annual return (CAGR)\", format_pct(mine[\"cagr\"]), format_pct(theirs[\"cagr\"])],\n            [\"Volatility a year\", format_pct(mine[\"volatility\"]), format_pct(theirs[\"volatility\"])],\n            [\"Deepest fall from a peak\", format_pct(mine[\"max_drawdown\"]), format_pct(theirs[\"max_drawdown\"])],\n            [\"Sharpe ratio\", f\"{mine['sharpe']:.2f}\", f\"{theirs['sharpe']:.2f}\"],\n        ],\n        numeric_cols=(1, 2))\n\nwith st.expander(\"How these are calculated\"):\n    st.markdown(\n        \"- **CAGR:** (last value \u00f7 first value) raised to 1 \u00f7 years, minus 1. Years are the days \"\n        \"between the first and last date, divided by 365.\\n\"\n        \"- **Volatility:** the sample standard deviation of period returns, scaled to a year by the \"\n        f\"square root of the observations per year (here {periods}, worked out from your dates).\\n\"\n        \"- **Deepest fall:** the largest drop from a running peak to a later low.\\n\"\n        \"- **Sharpe ratio:** (CAGR \u2212 risk-free rate) \u00f7 annual volatility. The risk-free rate is the \"\n        \"assumption in the sidebar.\\n\"\n        \"- These come from a value history only. Money added or withdrawn along the way would need \"\n        \"dated cash flows (XIRR), which this page does not read.\")\n\ntheme.footnote(\"Educational illustration only, not investment advice. Past performance does not \"\n               \"predict future results. Figures are only as good as the data you upload.\")\n", "app/portfolio_io.py": "\"\"\"Reading uploaded value series (CSV) for the dashboard.\"\"\"\nimport io\n\nimport pandas as pd\n\n\nclass DataError(ValueError):\n    \"\"\"An uploaded series cannot be used. The message says how to fix it.\"\"\"\n\n\nVALUE_COLUMNS = (\"value\", \"nav\", \"close\", \"portfolio_value\", \"portfolio value\", \"price\")\n\n\ndef _read(source):\n    if hasattr(source, \"getvalue\"):          # Streamlit upload (bytes) or a text buffer (str)\n        raw = source.getvalue()\n        source = io.StringIO(raw) if isinstance(raw, str) else io.BytesIO(raw)\n    try:\n        return pd.read_csv(source)\n    except Exception as exc:\n        raise DataError(\"The file could not be read as a CSV. Save it as a comma-separated \"\n                        \"(.csv) file with a header row: date,value.\") from exc\n\n\ndef parse_series(source):\n    \"\"\"Read a CSV with a date column and a value column into a clean, sorted DataFrame.\"\"\"\n    df = _read(source)\n    df.columns = [str(c).strip().lower() for c in df.columns]\n    if \"date\" not in df.columns:\n        raise DataError(\"No 'date' column found. The first row must be the headers: date,value.\")\n    value_col = next((c for c in VALUE_COLUMNS if c in df.columns), None)\n    if value_col is None:\n        raise DataError(\"No 'value' column found. The first row must be the headers: date,value.\")\n\n    raw_dates = df[\"date\"].astype(str).str.strip()\n    dates = pd.to_datetime(raw_dates, format=\"ISO8601\", errors=\"coerce\")\n    if dates.isna().any():\n        dates = pd.to_datetime(raw_dates, dayfirst=True, format=\"mixed\", errors=\"coerce\")\n    bad = dates.isna()\n    if bad.any():\n        rows = (df.index[bad][:3] + 2).tolist()\n        raise DataError(f\"Could not read the date in row(s) {rows}. \"\n                        \"Use YYYY-MM-DD or DD-MM-YYYY.\")\n\n    values = pd.to_numeric(df[value_col].astype(str).str.replace(\",\", \"\").str.strip(),\n                           errors=\"coerce\")\n    bad = values.isna() | (values <= 0)\n    if bad.any():\n        rows = (df.index[bad][:3] + 2).tolist()\n        raise DataError(f\"Values must be positive numbers. Check row(s) {rows}.\")\n\n    out = pd.DataFrame({\"date\": dates, \"value\": values.astype(float)})\n    if out[\"date\"].duplicated().any():\n        raise DataError(\"Each date can appear only once. Remove or merge the repeated dates.\")\n    out = out.sort_values(\"date\").reset_index(drop=True)\n    if len(out) < 3:\n        raise DataError(\"Need at least 3 rows to calculate risk measures.\")\n    return out\n\n\ndef infer_periods_per_year(dates):\n    \"\"\"Guess how often the series is observed from the typical gap between dates.\"\"\"\n    gap = pd.Series(pd.to_datetime(list(dates))).diff().dt.days.median()\n    if gap <= 4:\n        return 252\n    if gap <= 10:\n        return 52\n    if gap <= 45:\n        return 12\n    if gap <= 120:\n        return 4\n    return 1\n\n\ndef align(portfolio, benchmark):\n    \"\"\"Keep only the dates both series share, so the comparison is like for like.\"\"\"\n    merged = portfolio.merge(benchmark, on=\"date\", suffixes=(\"_p\", \"_b\"))\n    if len(merged) < 3:\n        raise DataError(\"The portfolio and benchmark share fewer than 3 dates. \"\n                        \"Use the same dates in both files.\")\n    p = merged[[\"date\", \"value_p\"]].rename(columns={\"value_p\": \"value\"})\n    b = merged[[\"date\", \"value_b\"]].rename(columns={\"value_b\": \"value\"})\n    return p, b\n\n\ndef rebase(values, base=100.0):\n    \"\"\"Rescale a series so it starts at `base`.\"\"\"\n    first = values[0]\n    return [v / first * base for v in values]\n", "app/theme.py": "\"\"\"Shared look for every page: warm editorial (paper, ink, saffron).\n\nThe `*_html` functions are pure and return single-line HTML (no blank lines or\nindentation, which Markdown would mangle). The matching render functions call\nst.markdown. All text is escaped; pass `Html(...)` for markup you built yourself.\n\"\"\"\nimport html\nfrom string import Template\n\nimport altair as alt\nimport streamlit as st\n\nPAPER = \"#05070A\"\nSIDEBAR = \"#0A0E12\"\nINK = \"#DFE7E0\"\nMUTED = \"#8F9A93\"\nRULE = \"#2A3238\"\nSAFFRON = \"#E0231C\"\nSAFFRON_DEEP = \"#FF5A3C\"\nGREEN = \"#7FB59A\"\nBRICK = \"#E0231C\"\nSLATE = \"#78837C\"\n\nBODY_FONT = \"Onest\"\n\n\nclass Html(str):\n    \"\"\"Marks a string as trusted markup so it is not escaped.\"\"\"\n\n\ndef esc(value):\n    return value if isinstance(value, Html) else html.escape(str(value))\n\n\nCSS = Template(\"\"\"\n@import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap');\nhtml, body, .stApp, [data-testid=\"stAppViewContainer\"], [data-testid=\"stMain\"] { background: $PAPER; color: $INK; }\n.stApp, .stApp p, .stApp li, .stApp label, .stApp input, .stApp textarea { font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; }\n.stApp h1, .stApp h2, .stApp h3 { font-family: ' hite-space: nowrap; }\n.stApp .pms-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; font-size: 0.9rem; color: $MUTED; margin: 0.2rem 0 1rem; }\n.stApp .pms-legend .dot { margin: 0 0.4rem 0 0; }\n\n.stApp .pms-rows .row { display: grid; grid-template-columns: minmax(150px, 1.2fr) 8.5rem 3fr; gap: 0.4rem 1rem; padding: 0.75rem 0; border-bottom: 1px solid $RULE; line-height: 1.45; }\n.stApp .pms-rows .name { font-family: 'Onest', system-ui, sans-serif; font-size: 1.12rem; font-weight: 600; }\n.stApp .pms-rows .open { color: $GREEN; font-weight: 600; }\n.stApp .pms-rows .below { color: $BRICK; font-weight: 600; }\n.stApp .pms-rows .caution { color: $SAFFRON_DEEP; display: block; margin-top: 0.15rem; }\n\n.stApp .pms-index .row { display: grid; grid-template-columns: minmax(180px, 1fr) 3fr; gap: 0.3rem 1.5rem; padding: 0.95rem 0; border-bottom: 1px solid $RULE; line-height: 1.5; }\n.stApp .pms-index .name { font-family: 'Onest', system-ui, sans-serif; font-size: 1.3rem; font-weight: 500; }\n.stApp .pms-foot { color: $MUTED; font-size: 0.85rem; line-height: 1.5; border-top: 1px solid $RULE; padding-top: 0.9rem; margin-top: 2.5rem; max-width: 80ch; }\n.stApp .pms-muted { color: $MUTED; }\n\n.stApp::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(125% 95% at 50% 42%, transparent 40%, rgba(2, 4, 6, 0.6)); }\n.stApp::after { content: ''; position: fixed; inset: -1px; z-index: 1; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay; background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='100%25' height='100%25' filter='url(%23n)'/><\/svg>\"); }\n.stApp .pms-masthead h1 { text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; }\n.stApp .pms-stat .value { font-weight: 300; }\n\n@media (max-width: 640px) {\n  .stApp .pms-rows .row, .stApp .pms-index .row { grid-template-columns: 1fr; }\n  .stApp .pms-stat { border-left: none; padding-left: 0; border-top: 1px solid $RULE; }\n  .stApp .pms-stat:first-child { border-top: none; }\n}\n\"\"\").safe_substitute(\n    PAPER=PAPER, SIDEBAR=SIDEBAR, INK=INK, MUTED=MUTED, RULE=RULE, SAFFRON=SAFFRON,\n    SAFFRON_DEEP=SAFFRON_DEEP, GREEN=GREEN, BRICK=BRICK,\n)\n\n\ndef apply():\n    \"\"\"Inject the shared styles. Call once near the top of every page.\"\"\"\n    st.markdown(f\"<style>{CSS}<\/style>\", unsafe_allow_html=True)\n\n\n# ---------- pure HTML builders ----------\ndef masthead_html(title, deck=None):\n    deck_html = f\"<p>{esc(deck)}<\/p>\" if deck else \"\"\n    return f'<div class=\"pms-masthead\"><h1>{esc(title)}<\/h1>{deck_html}<\/div>'\n\n\ndef section_html(title, note=None):\n    note_html = f\"<p>{esc(note)}<\/p>\" if note else \"\"\n    return f'<div class=\"pms-section\"><h2>{esc(title)}<\/h2>{note_html}<\/div>'\n\n\ndef stat_strip_html(stats):\n    \"\"\"stats: list of dicts with label, value, optional note and tone (good, bad, neutral).\n\n    The first stat is the lead figure and gets the saffron highlighter.\n    \"\"\"\n    cells = []\n    for i, s in enumerate(stats):\n        lead = \" lead\" if i == 0 else \"\"\n        note = \"\"\n        if s.get(\"note\"):\n            tone = s.get(\"tone\", \"neutral\")\n            tone_class = \"\" if tone == \"neutral\" else f\" {tone}\"\n            note = f'<div class=\"note{tone_class}\">{esc(s[\"note\"])}<\/div>'\n        cells.append(\n            f'<div class=\"pms-stat{lead}\"><div class=\"label\">{esc(s[\"label\"])}<\/div>'\n            f'<div class=\"value\"><span>{esc(s[\"value\"])}<\/span><\/div>{note}<\/div>'\n        )\n    return f'<div class=\"pms-stats\">{\"\".join(cells)}<\/div>'\n\n\ndef notice_html(title, items=None, text=None):\n    body = f\"<div>{esc(text)}<\/div>\" if text else \"\"\n    if items:\n        body += \"<ul>\" + \"\".join(f\"<li>{esc(i)}<\/li>\" for i in items) + \"<\/ul>\"\n    return f'<div class=\"pms-notice\"><strong>{esc(title)}<\/strong>{body}<\/div>'\n\n\ndef data_table_html(headers, rows, numeric_cols=(), min_width=None):\n    head = \"\".join(\n        f'<th class=\"{\"num\" if i in numeric_cols else \"\"}\">{esc(h)}<\/th>' for i, h in enumerate(headers))\n    body = \"\".join(\n        \"<tr>\" + \"\".join(\n            f'<td class=\"{\"num\" if i in numeric_cols else \"\"}\">{esc(c)}<\/td>' for i, c in enumerate(row)\n        ) + \"<\/tr>\"\n        for row in rows)\n    style = f' style=\"min-width:{int(min_width)}px\"' if min_width else \"\"\n    return f'<div class=\"pms-tablewrap\"><table class=\"pms-table\"{style}><thead><tr>{head}<\/tr><\/thead><tbody>{body}<\/tbody><\/table><\/div>'\n\n\ndef status_dot_html(status, label):\n    return Html(f'<span class=\"dot dot-{html.escape(status)}\" title=\"{html.escape(label)}\"><\/span>'\n                f'<span class=\"sr\"> ({html.escape(label)})<\/span>')\n\n\ndef legend_html(items):\n    \"\"\"items: list of (status, label).\"\"\"\n    parts = \"\".join(f'<span><span class=\"dot dot-{html.escape(s)}\"><\/span>{esc(l)}<\/span>' for s, l in items)\n    return f'<div class=\"pms-legend\">{parts}<\/div>'\n\n\ndef verdict_rows_html(rows):\n    \"\"\"rows: list of dicts with name, verdict (open or below), verdict_text, detail, optional caution.\"\"\"\n    out = []\n    for r in rows:\n        caution = f'<span class=\"caution\">{esc(r[\"caution\"])}<\/span>' if r.get(\"caution\") else \"\"\n        out.append(\n            f'<div class=\"row\"><div class=\"name\">{esc(r[\"name\"])}<\/div>'\n            f'<div class=\"{html.escape(r[\"verdict\"])}\">{esc(r[\"verdict_text\"])}<\/div>'\n            f'<div>{esc(r[\"detail\"])}{caution}<\/div><\/div>')\n    return f'<div class=\"pms-rows\">{\"\".join(out)}<\/div>'\n\n\ndef index_html(entries):\n    \"\"\"entries: list of (name, description).\"\"\"\n    rows = \"\".join(f'<div class=\"row\"><div class=\"name\">{esc(n)}<\/div><div>{esc(d)}<\/div><\/div>'\n                   for n, d in entries)\n    return f'<div class=\"pms-index\">{rows}<\/div>'\n\n\ndef footnote_html(text):\n    return f'<div class=\"pms-foot\">{esc(text)}<\/div>'\n\n\n# ---------- render helpers ----------\ndef _render(markup):\n    st.markdown(markup, unsafe_allow_html=True)\n\n\ndef masthead(title, deck=None):\n    _render(masthead_html(title, deck))\n\n\ndef section(title, note=None):\n    _render(section_html(title, note))\n\n\ndef stat_strip(stats):\n    _render(stat_strip_html(stats))\n\n\ndef notice(title, items=None, text=None):\n    _render(notice_html(title, items, text))\n\n\ndef data_table(headers, rows, numeric_cols=(), min_width=None):\n    _render(data_table_html(headers, rows, numeric_cols, min_width))\n\n\ndef footnote(text):\n    _render(footnote_html(text))\n\n\n# ---------- charts ----------\ndef style_chart(chart):\n    \"\"\"Give an Altair chart the same paper, ink and hairline look as the pages.\"\"\"\n    return (chart.configure(background=PAPER)\n            .configure_view(stroke=None)\n            .configure_axis(labelFont=BODY_FONT, titleFont=BODY_FONT, labelColor=MUTED,\n                            titleColor=MUTED, gridColor=RULE, gridOpacity=0.7, domainColor=RULE,\n                            tickColor=RULE, labelFontSize=12, titleFontSize=12,\n                            titleFontWeight=\"normal\")\n            .configure_legend(labelFont=BODY_FONT, labelColor=INK, labelFontSize=13,\n                              symbolType=\"stroke\", symbolStrokeWidth=3))\n\n\ndef show_chart(chart):\n    st.altair_chart(style_chart(chart), theme=None)\n\n\n__all__ = [\"Html\", \"alt\"]\n", "app/vehicles.py": "\"\"\"Loading and querying the sourced vehicle comparison data.\"\"\"\nimport json\nfrom pathlib import Path\n\nfrom app.formatting import format_inr\n\nDATA_PATH = Path(__file__).resolve().parents[1] / \"data\" / \"vehicles.json\"\n\nSTATUS_ORDER = [\"official\", \"official_reported\", \"legal_database\", \"secondary\", \"not_verified\"]\nSTATUS_EMOJI = {\n    \"official\": \"\u2705\",\n    \"official_reported\": \"\u2705\",\n    \"legal_database\": \"\ud83d\udfe6\",\n    \"secondary\": \"\ud83d\udfe7\",\n    \"not_verified\": \"\u2b1c\",\n}\nSTATUS_SHORT = {\n    \"official\": \"Official source\",\n    \"official_reported\": \"Official document, figure via news report\",\n    \"legal_database\": \"Act text via tax-law database\",\n    \"secondary\": \"Secondary source\",\n    \"not_verified\": \"Not verified\",\n}\n\n\ndef load_data(path=None):\n    with open(path or DATA_PATH, encoding=\"utf-8\") as f:\n        return json.load(f)\n\n\ndef check_eligibility(data, amount, accredited=False):\n    \"\"\"For each vehicle, say whether an amount meets the stated minimum.\n\n    Uses the min_investment fact (amount_inr, accredited_exempt) of each vehicle.\n    \"\"\"\n    results = []\n    for vid, vehicle in data[\"vehicles\"].items():\n        fact = vehicle[\"facts\"][\"min_investment\"]\n        minimum = fact[\"amount_inr\"]\n        if accredited and fact.get(\"accredited_exempt\"):\n            verdict = \"open\"\n            detail = \"Accredited investors are exempt from the minimum.\"\n        elif amount >= minimum:\n            verdict = \"open\"\n            detail = f\"Meets the minimum of {format_inr(minimum)}.\"\n        else:\n            verdict = \"below\"\n            detail = (f\"Short by {format_inr(minimum - amount)} \"\n                      f\"(minimum {format_inr(minimum)}).\")\n        caution = None\n        if vehicle.get(\"status\") == \"approved_not_confirmed_in_force\":\n            caution = \"Approved by SEBI's Board on 24 Sep 2026. Not confirmed in force.\"\n        results.append({\n            \"id\": vid,\n            \"name\": vehicle[\"name\"],\n            \"verdict\": verdict,\n            \"detail\": detail,\n            \"caution\": caution,\n            \"figure_status\": fa ount_inr\": 2500000,\n          \"note\": \"Approved, not confirmed in force.\",\n          \"accredited_exempt\": false\n        },\n        \"fees\": {\n          \"label\": \"Fees\",\n          \"value\": \"Fixed management fee capped at 1% of client assets. Performance-based fee also permitted. Exit load waived.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/sep-2026/1790259036651.pdf\",\n              \"supports\": \"PR No. 59/2026, item 1.2.1.5.2\"\n            }\n          ]\n        },\n        \"structure\": {\n          \"label\": \"What it is\",\n          \"value\": \"Portfolio managers invest client money only in direct plans of mutual funds, including ETFs, index funds and SIFs.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/sep-2026/1790259036651.pdf\",\n              \"supports\": \"PR No. 59/2026\"\n            }\n          ]\n        }\n      }\n    },\n    \"aif\": {\n      \"name\": \"Alternative Investment Fund (AIF)\",\n      \"regulator\": \"SEBI\",\n      \"regulation\": \"SEBI (Alternative Investment Funds) Regulations, 2012 (amended up to 14 July 2026)\",\n      \"facts\": {\n        \"min_investment\": {\n          \"label\": \"Minimum investment per investor\",\n          \"value\": \"Rs 1 crore. Rs 25 lakh for employees or directors of the fund or its manager. Does not apply to accredited investors.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1785301664601.pdf\",\n              \"supports\": \"Regulation 10(c)\"\n            }\n          ],\n          \"amount_inr\": 10000000,\n          \"note\": \"Accredited investors exempt. Each scheme needs a corpus of at least Rs 20 crore.\",\n          \"accredited_exempt\": true\n        },\n        \"categories\": {\n          \"label\": \"Categories\",\n          \"value\": \"Category I: start-ups, SMEs, infrastructure and similar. Category II: private equity and debt funds, no leverage beyond limits. Category III: complex or trading strategies that may use leverage.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1785301664601.pdf\",\n              \"supports\": \"Regulation 3(4)\"\n            }\n          ]\n        },\n        \"lock_in\": {\n          \"label\": \"Tenure and liquidity\",\n          \"value\": \"Category I and II must be close-ended with a minimum tenure of three years. Category III can be open- or close-ended.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1785301664601.pdf\",\n              \"supports\": \"Regulation 13\"\n            }\n          ]\n        },\n        \"large_value_fund\": {\n          \"label\": \"Large value fund for accredited investors\",\n          \"value\": \"Each investor must invest at least Rs 25 crore (previously Rs 70 crore, changed with effect from 19 Nov 2025).\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1785301664601.pdf\",\n              \"supports\": \"Regulation 2(1)(pa)\"\n            }\n          ],\n          \"amount_inr\": 250000000\n        },\n        \"accredited_investor\": {\n          \"label\": \"Accredited investor (individual, HUF, family trust, sole proprietorship)\",\n          \"value\": \"Annual income of at least Rs 2 crore; or net worth of at least Rs 7.5 crore with at least Rs 3.75 crore in financial assets; or income of at least Rs 1 crore with net worth of at least Rs 5 crore (Rs 2.5 crore in financial assets). Certificate from an accreditation agency needed.\",\n          \"status\": \"official\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1785301664601.pdf\",\n              \"supports\": \"Regulation 2(1)(ab)\"\n            }\n          ],\n          \"note\": \"SEBI's Board approved a manager-led route and a Rs 5 crore securities-market-exposure test on 24 Sep 2026. Not confirmed in force.\"\n        },\n        \"tax\": {\n          \"label\": \"Tax\",\n          \"value\": \"Category I and II AIFs generally get pass-through taxation. Category III AIFs are taxed at fund level.\",\n          \"status\": \"secondary\",\n          \"sources\": [\n            {\n              \"url\": \"https://www.businesstoday.in/amp/personal-finance/tax/story/capital-gain-tax-after-budget-2025-latest-ltcg-stcg-rates-on-various-assets-post-budget-2025-463274-2025-02-03\",\n              \"supports\": \"Pass-through vs fund-level taxation (Feb 2025 article)\"\n            }\n          ]\n        },\n        \"tax_cat3_effective\": {\n          \"label\": \"Effective tax on Category III AIFs\",\n          \"value\": \"Not verified. Varies by manager or scheme; check the offer documents.\",\n          \"status\": \"not_verified\",\n          \"sources\": [],\n          \"note\": \"Not researched.\"\n        }\n      }\n    }\n  }\n}\n", "engine/analytics.py": "\"\"\"Portfolio analytics: CAGR, XIRR, volatility, max drawdown, Sharpe.\n\nConventions (these match Excel, and the reference workbook):\n- Years are counted as days / 365.\n- XIRR discounts each cash flow by (days since the first date) / 365.\n- Volatility is the sample standard deviation (Excel STDEV.S) of period returns,\n  scaled to a year by sqrt(periods per year).\n- Sharpe ratio = (annual return - risk-free rate) / annual volatility.\n  The risk-free rate is always passed in; nothing is hard-coded.\n\"\"\"\nimport math\nimport statistics\n\n\ndef cagr(start_value, end_value, days):\n    \"\"\"Compound annual growth rate over `days` calendar days.\"\"\"\n    if start_value <= 0 or end_value <= 0:\n        raise ValueError(\"start and end values must be positive\")\n    if days <= 0:\n        raise ValueError(\"days must be positive\")\n    return (end_value / start_value) ** (365 / days) - 1\n\n\ndef xirr(cashflows):\n    \"\"\"Annualised return for dated cash flows, [(date, amount), ...].\n\n    Money invested is negative, money received (including the final value) is\n    positive. Solved by bisection, so it does not depend on a starting guess.\n    \"\"\"\n    flows = sorted(cashflows, key=lambda x: x[0])\n    if len(flows) < 2:\n        raise ValueError(\"need at least two cash flows\")\n    amounts = [a for _, a in flows]\n    if not (any(a > 0 for a in amounts) and any(a < 0 for a in amounts)):\n        raise ValueError(\"cash flows need at least one positive and one negative amount\")\n    start = flows[0][0]\n    years = [((d - start).days) / 365 for d, _ in flows]\n\n    def npv(rate):\n        return sum(a / (1 + rate) ** t for a, t in zip(amounts, years))\n\n    low, high = -0.999999, 1.0\n    while npv(low) * npv(high) > 0 and high < 1e6:\n        high *= 2\n    if npv(low) * npv(high) > 0:\n        raise ValueError(\"could not find a rate that balances the cash flows\")\n    for _ in range(300):\n        mid = (low + high) / 2\n        if npv(low) * npv(mid) <= 0:\n            high = mid\n        else:\n            low = mid\n    return (low + high) / 2\n\n\ndef period_returns(values):\n    \"\"\"Simple return for each period: value[t] / value[t-1] - 1.\"\"\"\n    if len(values) < 2:\n        raise ValueError(\"need at least two values\")\n    return [values[i] / values[i - 1] - 1 for i in range(1, len(values))]\n\n\ndef volatility(returns, periods_per_year):\n    \"\"\"Annualised volatility from period returns (sample standard deviation).\"\"\"\n    if len(returns) < 2:\n        raise ValueError(\"need at least two returns\")\n    return statistics.stdev(returns) * math.sqrt(periods_per_year)\n\n\ndef max_drawdown(values):\n    \"\"\"Largest fall from a running peak, as a negative fraction (0 if never below a peak).\"\"\"\n    if not values:\n        raise ValueError(\"need at least one value\")\n    peak = values[0]\n    worst = 0.0\n    for v in values:\n        peak = max(peak, v)\n        worst = min(worst, v / peak - 1)\n    return worst\n\n\ndef drawdown_series(values):\n    \"\"\"Fall from the running peak at every point, as negative fractions (0 at a new peak).\"\"\"\n    if not values:\n        raise ValueError(\"need at least one value\")\n    peak = values[0]\n    out = []\n    for v in values:\n        peak = max(peak, v)\n        out.append(v / peak - 1)\n    return out\n\n\ndef sharpe_ratio(annual_return, risk_free_rate, annual_volatility):\n    \"\"\"(annual return - risk-free rate) / annual volatility.\"\"\"\n    if annual_volatility == 0:\n        raise ValueError(\"volatility is zero, Sharpe ratio is undefined\")\n    return (annual_return - risk_free_rate) / annual_volatility\n\n\ndef summarize(dates, values, risk_free_rate, periods_per_year=12):\n    \"\"\"All the headline numbers for a dated value series.\"\"\"\n    if len(dates) != len(values):\n        raise ValueError(\"dates and values must have the same length\")\n    days = (dates[-1] - dates[0]).days\n    annual_return = cagr(values[0], values[-1], days)\n    vol = volatility(period_returns(values), periods_per_year)\n    return {\n        \"years\": days / 365,\n        \"cagr\": annual_return,\n        \"volatility\": vol,\n        \"max_drawdown\": max_drawdown(values),\n        \"sharpe\": sharpe_ratio(annual_return, risk_free_rate, vol),\n    }\n", "engine/fees.py": "\"\"\"PMS fee engine.\n\nFollows the conventions in the reference workbook exactly:\n- Annual periods, fees charged at year end, no contributions or withdrawals.\n- Fixed fee is a % of the opening value, charged even in loss years.\n- Performance fee is measured on profit after the fixed fee, against a base\n  (the opening value, or the high-water mark if hwm is True).\n- A hurdle is a % of the base. Without catch-up, only profit above the hurdle\n  is charged. With catch-up, once profit beats the hurdle the whole profit\n  is charged.\n- The exit load is charged once, on the final closing value.\n\"\"\"\n\n\ndef simulate(initial, gross_returns, fixed_fee, perf_fee, hurdle,\n             catch_up, hwm, exit_load):\n    \"\"\"Run a fee scenario year by year.\n\n    All percentages are decimals (0.025 means 2.5%).\n    Returns a dict with the year-end values and the totals.\n    \"\"\"\n    value = initial              # opening value of the current year\n    high_water_mark = initial    # highest closing value so far\n    closing_values = []\n    fixed_fees = []\n    perf_fees = []\n    total_fixed = 0.0\n    total_perf = 0.0\n\n    for r in gross_returns:\n        value_before_fees = value * (1 + r)\n        fixed = value * fixed_fee\n\n        base = high_water_mark if hwm else value\n        profit = value_before_fees - fixed - base\n        hurdle_amount = base * hurdle\n\n        if catch_up:\n            perf = perf_fee * profit if profit > hurdle_amount else 0.0\n        else:\n            perf = perf_fee * max(0.0, profit - hurdle_amount)\n\n        value = value_before_fees - fixed - perf\n        high_water_mark = max(high_water_mark, value)\n\n        closing_values.append(value)\n        fixed_fees.append(fixed)\n        perf_fees.append(perf)\n        total_fixed += fixed\n        total_perf += perf\n\n    exit_amount = value * exit_load\n    final_net_value = value - exit_amount\n    total_fees = total_fixed + total_perf + exit_amount\n\n    return {\n        \"closing_values\": closing_values,\n        \"fixed_fees\": fixed_fees,\n        \"perf_fees\": perf_fees,\n        \"exit_amount\": exit_amount,\n        \"final_net_value\": final_net_value,\n        \"total_fees\": total_fees,\n    }\n", "app/__init__.py": "", "engine/__init__.py": "", "entry.py": "import runpy\nrunpy.run_path('app/pages/1_Fee_Calculator.py', run_name='__main__')\n"}, "streamlitConfig": {"theme.base": "dark", "theme.primaryColor": "#E0231C", "theme.backgroundColor": "#05070A", "theme.secondaryBackgroundColor": "#0A0E12", "theme.textColor": "#DFE7E0"}}, document.getElementById("root"));</script></body></html>
